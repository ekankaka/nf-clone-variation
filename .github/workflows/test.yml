name: Synthetic tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install matplotlib
      - run: python tests/test_variation.py
      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          echo "$PWD" >> "$GITHUB_PATH"
        env:
          NXF_VER: '25.10.4'
      - name: Run synthetic Nextflow pipeline
        run: |
          nextflow run main.nf \
            --input tests/data/clone_summary.csv \
            --clone_alignment_folder tests/data/clone_alignments \
            --read_assignments tests/data/read_assignments.csv \
            --outdir results_test -profile local
          python tests/test_variation.py results_test
        env:
          NXF_VER: '25.10.4'
      - name: Check empty eligible-clone output
        run: |
          nextflow run main.nf \
            --input tests/data/clone_summary.csv \
            --clone_alignment_folder tests/data/clone_alignments \
            --read_assignments tests/data/read_assignments.csv \
            --min_unique_reads 100 --outdir results_empty -profile local
          test "$(wc -l < results_empty/clone_variation_summary.csv)" -eq 1
          test "$(wc -l < results_empty/variants.csv)" -eq 1
          test "$(wc -l < results_empty/variants_by_timepoint.csv)" -eq 1
        env:
          NXF_VER: '25.10.4'
