<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="536" viewBox="0 0 1420 536" role="img" aria-labelledby="title desc">
<title id="title">nf-clone-variation workflow</title>
<desc id="desc">Three upstream files are used to select clones with at least three PCR families by default, match alignments and metadata, assess consensus-relative variation and produce summaries, variant tables and plots. Equal-width aligned example sequences illustrate a substitution, insertion and deletion at different positions.</desc>
