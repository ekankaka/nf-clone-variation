.heading { font-size:21px; font-weight:700; }
.body { font-size:17px; }
.file { font-family: Arial, Helvetica, sans-serif; font-size:16px; }
.label { font-size:16px; font-weight:600; }
.base { font-family: monospace; font-size:19px; font-weight:600; }
.legend { font-size:15px; }
</style>
